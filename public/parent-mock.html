<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>부모 mock — 오늘의 4번타자 통합 검증</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Malgun Gothic', 'Pretendard', sans-serif;
      background: #1a1a1a;
      color: #f2e8c9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a2b5c;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 3px solid #ffc83d;
    }
    .header h1 { font-size: 14px; color: #ffc83d; letter-spacing: 1px; }
    .header .badge {
      font-size: 10px;
      padding: 4px 8px;
      background: #d62828;
      color: #fff;
      border-radius: 2px;
      letter-spacing: 1px;
    }
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .game {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 0;
    }
    .game iframe {
      width: 100%;
      height: 100%;
      max-width: 540px;
      max-height: 100%;
      aspect-ratio: 9 / 16;
      border: none;
      background: #1a1a1a;
    }
    .log {
      width: 380px;
      background: #0a0e27;
      border-left: 2px solid #ffc83d;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .log-header {
      padding: 10px 14px;
      background: #1a2b5c;
      color: #ffc83d;
      font-size: 11px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .log-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .entry {
      padding: 6px 10px;
      margin-bottom: 6px;
      border-radius: 4px;
      word-break: break-all;
    }
    .entry.in { background: rgba(182, 255, 0, 0.1); border-left: 3px solid #b6ff00; }
    .entry.out { background: rgba(255, 200, 61, 0.1); border-left: 3px solid #ffc83d; }
    .entry .arrow { font-weight: bold; margin-right: 4px; }
    .entry.in .arrow { color: #b6ff00; }
    .entry.out .arrow { color: #ffc83d; }
    .entry .type { color: #fff; font-weight: bold; }
    .entry .payload { color: #888; display: block; margin-top: 2px; font-size: 10px; }
    .controls {
      padding: 10px;
      background: #1a2b5c;
      border-top: 1px solid #ffc83d;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .controls button {
      flex: 1 1 auto;
      padding: 6px 8px;
      background: #d62828;
      color: #fff;
      border: 2px solid #fff;
      font-size: 10px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.5px;
    }
    .controls button:hover { background: #ff4a6e; }
    .clear-btn {
      background: transparent;
      color: #888;
      border: none;
      cursor: pointer;
      font-size: 10px;
    }
    @media (max-width: 800px) {
      .main { flex-direction: column; }
      .log { width: 100%; max-height: 40vh; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎮 부모 mock — 오늘의 4번타자</h1>
    <span class="badge">CLEANUP prefix</span>
  </div>
  <div class="main">
    <div class="game">
      <iframe id="game-frame" src="/" title="오늘의 4번타자"></iframe>
    </div>
    <div class="log">
      <div class="log-header">
        <span>📡 메시지 로그 (양방향)</span>
        <button class="clear-btn" onclick="clearLog()">clear</button>
      </div>
      <div class="log-body" id="log-body">
        <div class="entry in" style="opacity: 0.6;">
          <span class="arrow">--</span>
          <span class="type">대기 중...</span>
        </div>
      </div>
      <div class="controls">
        <button onclick="sendUserInfo()">USER_INFO 응답</button>
        <button onclick="sendAdCompleted()">AD_COMPLETED</button>
        <button onclick="sendAdFailed()">AD_FAILED</button>
        <button onclick="sendLeaderboardData()">LEADERBOARD_DATA</button>
      </div>
    </div>
  </div>

  <script>
    const gameFrame = document.getElementById('game-frame');
    const logBody = document.getElementById('log-body');

    // Mock 유저 상태 (서버 DB 흉내)
    const mockUser = {
      nickname: '테스트타자',
      team: 'lg',
      free_left: 2,
      ad_left: 3,
      daily_milestones_done: [],
      lifetime_50_done: false,
    };

    // 자동 응답 + 로그
    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (!msg || typeof msg.type !== 'string') return;
      if (!msg.type.startsWith('CLEANUP:')) return;

      logMessage('in', msg);

      // 자동 응답 처리
      switch (msg.type) {
        case 'CLEANUP:GAME_READY':
          // 게임 진입 시 USER_INFO 자동 응답
          setTimeout(() => sendUserInfo(), 200);
          break;
        case 'CLEANUP:PLAY_AD':
          // 광고 요청 → 1.5초 후 AD_COMPLETED 자동 응답 (실제로는 광고 SDK 호출)
          console.log('[mock] 광고 시뮬레이션 1.5초...');
          setTimeout(() => sendAdCompleted(), 1500);
          break;
        case 'CLEANUP:TICKET_REWARD':
          console.log(`[mock] 응모권 ${msg.count}장 적립 — ${msg.round}회 마일스톤`);
          mockUser.daily_milestones_done.push(msg.round);
          break;
        case 'CLEANUP:GAME_OVER':
          console.log('[mock] 게임 종료 결과 수신 — 리더보드 자동 등록 흉내');
          console.log(`   회: ${msg.round}, 점수: ${msg.score}, 홈런: ${msg.homeruns}, 안타: ${msg.hits}, 아웃: ${msg.strikes}`);
          break;
        case 'CLEANUP:LEADERBOARD_REQUEST':
          setTimeout(() => sendLeaderboardData(), 300);
          break;
      }
    });

    function send(msg) {
      gameFrame.contentWindow.postMessage(msg, '*');
      logMessage('out', msg);
    }

    function sendUserInfo() {
      send({ type: 'CLEANUP:USER_INFO', ...mockUser });
    }

    function sendAdCompleted() {
      mockUser.ad_left = Math.max(0, mockUser.ad_left - 1);
      send({ type: 'CLEANUP:AD_COMPLETED' });
    }

    function sendAdFailed() {
      send({ type: 'CLEANUP:AD_FAILED', reason: 'user_skipped' });
    }

    function sendLeaderboardData() {
      send({
        type: 'CLEANUP:LEADERBOARD_DATA',
        entries: [
          { rank: 1, nickname: '4번타자김선수', team: 'lg', round: 47, score: 23450, created_at: '2026-05-10' },
          { rank: 2, nickname: '홈런왕민호', team: 'doosan', round: 42, score: 19800, created_at: '2026-05-12' },
          { rank: 3, nickname: '클러치박', team: 'kt', round: 38, score: 17200, created_at: '2026-05-11' },
          { rank: 4, nickname: '테스트타자', team: 'lg', round: 23, score: 12340, created_at: '2026-05-12', is_me: true },
          { rank: 5, nickname: '안타기계', team: 'samsung', round: 20, score: 11500, created_at: '2026-05-12' },
        ],
        my_rank: 4,
      });
    }

    function logMessage(direction, msg) {
      const entry = document.createElement('div');
      entry.className = `entry ${direction}`;
      const arrow = direction === 'in' ? '←' : '→';
      const { type, ...payload } = msg;
      const payloadStr = Object.keys(payload).length > 0 ? JSON.stringify(payload) : '';
      entry.innerHTML = `<span class="arrow">${arrow}</span><span class="type">${type}</span>${payloadStr ? `<span class="payload">${payloadStr}</span>` : ''}`;

      // Remove waiting placeholder on first real message
      const placeholder = logBody.querySelector('.entry[style*="0.6"]');
      if (placeholder) placeholder.remove();

      logBody.appendChild(entry);
      logBody.scrollTop = logBody.scrollHeight;
    }

    function clearLog() {
      logBody.innerHTML = '';
    }
  </script>
</body>
</html>
